[project]
name = "chesspuz"
version = "0.3.0"
description = "Dark-mode chess puzzle trainer with a chess.com-style Survival mode on the Lichess puzzle database"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["chess>=1.11", "PySide6-Essentials>=6.8", "zstandard>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
